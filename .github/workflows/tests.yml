name: Inselwürfel Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax prüfen
        run: |
          node --check core.js
          node --check app.js
          node --check sw.js
      - name: Würfelregeln und Punkte prüfen
        run: node --test tests/*.test.cjs
